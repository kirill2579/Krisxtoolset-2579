---
- name: Predict nginx directory permissions
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ _nginx_directories }}'

# copy cannot predict a new file below an absent directory in check mode.
- name: Predict nginx files in existing directories
  ansible.builtin.copy:
    content: '{{ item.content | default(omit) }}'
    src: '{{ item.src | default(omit) }}'
    checksum: '{{ item.checksum | default(omit) }}'
    decrypt: false
    follow: false
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ _nginx_managed_files }}'
  loop_control:
    label: '{{ item.dest }}'
  when: item.dest | dirname in (_nginx_original_directories.results | selectattr('stat.exists') | map(attribute='item') | list)
  no_log: true

- name: Report nginx files requiring a new directory
  ansible.builtin.debug:
    msg: 'Would create {{ item.dest }} after creating its parent directory.'
  loop: '{{ _nginx_managed_files }}'
  loop_control:
    label: '{{ item.dest }}'
  when: item.dest | dirname not in (_nginx_original_directories.results | selectattr('stat.exists') | map(attribute='item') | list)
  changed_when: true
  no_log: true

- name: Explain nginx check mode validation limit
  ansible.builtin.debug:
    msg: 'Check mode reads static files, renders templates and predicts file changes only. Candidate nginx syntax, referenced TLS files and service reload are not verified; no live configuration is written.'
