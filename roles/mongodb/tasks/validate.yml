---
- name: Require a supported platform and explicit three-node topology
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '22.04'
      - ansible_facts.architecture == 'x86_64'
      - mongodb_version == '7.0'
      - mongodb_action in ['validate', 'install', 'start', 'configure', 'bootstrap', 'manage', 'status']
      - mongodb_members | length == 3
      - mongodb_members | map(attribute='id') | list | sort == [0, 1, 2]
      - mongodb_members | map(attribute='host') | unique | length == 3
      - mongodb_members | map(attribute='inventory_host') | unique | length == 3
      - inventory_hostname in (mongodb_members | map(attribute='inventory_host') | list)
      - mongodb_replica_set is match('^[A-Za-z][A-Za-z0-9_-]{0,63}$')
      - mongodb_port | int > 1024
      - mongodb_port | int < 65536
      - mongodb_data_dir == '/var/lib/mongodb-krisx'
      - mongodb_config_file == '/etc/mongodb-krisx/mongod.yml'
      - mongodb_tls_certificate_key_file is match('^/[^\n\r]+$')
      - mongodb_tls_ca_file is match('^/[^\n\r]+$')
      - mongodb_config is mapping
      - mongodb_config.keys() | difference(['operationProfiling']) | length == 0
      - mongodb_bind_ip != '127.0.0.1'
      - "'127.0.0.1' in mongodb_bind_ip.split(',')"
    fail_msg: MongoDB 7 requires three explicit AVX-capable Ubuntu 22.04 amd64 hosts; no automatic major migration.

- name: Validate DNS member addresses and inventory references
  ansible.builtin.assert:
    that:
      - item.inventory_host in hostvars
      - item.id is integer
      - item.host.split(':')[0] | lower != 'localhost'
      - item.host is match('^[A-Za-z][A-Za-z0-9.-]*:[0-9]{2,5}$')
      - item.host.split(':')[1] | int == mongodb_port | int
      - item.keys() | difference(['id', 'host', 'inventory_host']) | length == 0
  loop: '{{ mongodb_members }}'

- name: Read real CPU flags before package installation
  ansible.builtin.command: cat /proc/cpuinfo
  register: mongodb_cpuinfo
  changed_when: false
  check_mode: false

- name: Reject CPUs without AVX
  ansible.builtin.assert:
    that: "'avx' in (mongodb_cpuinfo.stdout_lines | select('match', '^flags') | join(' ')).split()"
    fail_msg: MongoDB 7 requires AVX. Verify that the CPU exposes AVX before installing.

- name: Require supplied secrets without exposing their values
  ansible.builtin.assert:
    that:
      - mongodb_shared_keyfile is match('^[A-Za-z0-9+/=]{40,1024}$')
      - mongodb_admin_user | length > 0
      - mongodb_admin_password | length >= 20
  no_log: true

- name: Enforce one-host configuration batches
  ansible.builtin.assert:
    that: ansible_play_batch | length == 1
    fail_msg: Use serial 1 and any_errors_fatal true for configuration changes.
  when: mongodb_action == 'configure'
